# CI + GitHub Pages deployment for Home Heroes (أبطال البيت)
#
#  - Every push / pull request: typecheck, lint, unit + database tests, Edge Function checks, E2E,
#    plus typecheck + lint of the phone/tablet app (mobile/, Expo).
#  - Push to main (or manual run): build the website and the app's web preview, publish both to GitHub Pages:
#      https://<user>.github.io/<repo>/       → website
#      https://<user>.github.io/<repo>/app/   → phone/tablet app (test link before native builds)
#
# Repository settings required once:
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → Variables:
#     VITE_SUPABASE_URL              https://<project-ref>.supabase.co
#     VITE_SUPABASE_PUBLISHABLE_KEY  sb_publishable_...   (public by design — NEVER the secret/service_role key)
#   Optional variables:
#     VITE_BASE_PATH                 defaults to "/<repo-name>/"; forced to "/" when PAGES_CUSTOM_DOMAIN is set
#     PAGES_CUSTOM_DOMAIN            e.g. heroes.example.com (writes the CNAME file)
#
# Values may also be stored as Actions *secrets* with the same names; variables win when both exist.

name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Typecheck · Lint · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + database (RLS / scoring) tests
        run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Functions — type check & lint
        run: npm run functions:check

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run acceptance + layout suites against the QA stack
        run: npm run test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  mobile:
    name: App (Expo) — typecheck · lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [verify, e2e, mobile]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
      CONFIGURED_BASE: ${{ vars.VITE_BASE_PATH }}
      REPO_NAME: ${{ github.event.repository.name }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mobile

      - name: Resolve base path & check public configuration
        run: |
          if [ -n "$PAGES_CUSTOM_DOMAIN" ]; then
            base="/"
          elif [ -n "$CONFIGURED_BASE" ]; then
            base="$CONFIGURED_BASE"
          elif [[ "$REPO_NAME" == *.github.io ]]; then
            base="/"   # user/organisation site
          else
            base="/$REPO_NAME/"
          fi
          echo "VITE_BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "EXPO_BASE_URL=${base}app" >> "$GITHUB_ENV"
          if [ -n "$PAGES_CUSTOM_DOMAIN" ]; then site="https://$PAGES_CUSTOM_DOMAIN$base"; else site="https://${OWNER,,}.github.io$base"; fi
          echo "EXPO_PUBLIC_WEBSITE_URL=$site" >> "$GITHUB_ENV"
          echo "Base path: $base — website: $site — app: ${site}app/"

          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY are not set. The site will deploy but show the 'setup required' screen."
          fi

          # Refuse to ship an administrative key in a public bundle.
          key="$VITE_SUPABASE_PUBLISHABLE_KEY"
          if [[ "$key" == sb_secret_* ]]; then
            echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY contains a SECRET key. Use the publishable key." && exit 1
          fi
          role=$(node -e 'try{const p=(process.argv[1]||"").split(".")[1];console.log(p?JSON.parse(Buffer.from(p,"base64url")).role??"":"")}catch{console.log("")}' "$key")
          if [ "$role" = "service_role" ]; then
            echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is a service_role key. Use the anon/publishable key." && exit 1
          fi

      - name: Build website
        run: npm run build

      - name: Build app web preview (Expo) into /app
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npx expo export --platform web --output-dir ../dist/app

      - name: Pages extras (deep-link fallback, CNAME, no Jekyll)
        run: |
          # unknown paths: /app/… goes back into the app, anything else to the website (#/ routes)
          sed "s#__BASE__#$VITE_BASE_PATH#" mobile/web/404.template.html > dist/404.html
          touch dist/.nojekyll
          if [ -n "$PAGES_CUSTOM_DOMAIN" ]; then echo "$PAGES_CUSTOM_DOMAIN" > dist/CNAME; fi

      - name: Scan bundle for leaked secrets
        run: |
          if grep -RIl -E 'sb_secret_[A-Za-z0-9_-]{10,}|SUPABASE_SERVICE_ROLE_KEY|CHILD_CREDENTIAL_PEPPER=' dist; then
            echo "::error::A server-side secret appears in the static build." && exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
