# Manual backend deployment: database migrations + Edge Functions.
# Runs only when started by hand (Actions → "Deploy Supabase backend" → Run workflow),
# so a push can never change the production database by accident.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN    personal access token (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF     the project ref (the <ref> in https://<ref>.supabase.co)
#   SUPABASE_DB_PASSWORD     database password (needed for `db push`)
#   CHILD_CREDENTIAL_PEPPER  long random string (openssl rand -base64 48) — never change it after children exist
# Optional repository variable:
#   ALLOWED_ORIGIN           e.g. https://<user>.github.io  (CORS for the Edge Functions)

name: Deploy Supabase backend

on:
  workflow_dispatch:
    inputs:
      migrations:
        description: Apply database migrations
        type: boolean
        default: true
      functions:
        description: Deploy Edge Functions and their secrets
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply migrations
        if: inputs.migrations
        run: supabase db push --include-all

      - name: Set Edge Function secrets
        if: inputs.functions
        env:
          CHILD_CREDENTIAL_PEPPER: ${{ secrets.CHILD_CREDENTIAL_PEPPER }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN || '*' }}
        run: |
          if [ ${#CHILD_CREDENTIAL_PEPPER} -lt 32 ]; then
            echo "::error::CHILD_CREDENTIAL_PEPPER must be set and at least 32 characters." && exit 1
          fi
          supabase secrets set --project-ref "$PROJECT_REF" \
            CHILD_CREDENTIAL_PEPPER="$CHILD_CREDENTIAL_PEPPER" \
            ALLOWED_ORIGIN="$ALLOWED_ORIGIN"

      - name: Deploy Edge Functions
        if: inputs.functions
        run: |
          for fn in child-login manage-child manage-family; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
