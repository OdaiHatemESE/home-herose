# Builds the Android APK of the phone/tablet app (mobile/) and publishes it as a GitHub release,
# downloadable straight from a phone or tablet. Same approach as قديش.
#
# Runs only on request:
#   - Actions → "Build Android APK" → Run workflow, or
#   - pushing a tag named apk-<anything> (e.g. apk-1)
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['apk-*']

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      APP_BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Give Gradle more memory
        run: |
          sed -i '/^org.gradle.jvmargs/d' android/gradle.properties
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> android/gradle.properties
          tail -3 android/gradle.properties

      # 64-bit phones and the 32-bit ARM chips still found in budget tablets
      - name: Build release APK
        timeout-minutes: 60
        run: |
          cd android
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --console=plain --stacktrace 2>&1 | tee ../build.log || {
            echo "::error::$(grep -n -E 'Caused by|Exception|Error:|error:' ../build.log | head -50 | tr '\n' '~' | sed 's/~/ ⏎ /g')"
            echo "::error::$(tail -90 ../build.log | sed 's/\x1b\[[0-9;]*m//g' | tr '\n' '~' | sed 's/~/ ⏎ /g')"
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk ../home-heroes-${{ github.run_number }}.apk

      - name: Publish APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('apk-build-{0}', github.run_number) }}
          name: أبطال البيت — نسخة ${{ github.run_number }}
          body: |
            تطبيق أبطال البيت للموبايل والتابلت (Android).
            نزّل الملف من الموبايل أو التابلت وافتحه للتثبيت. إذا طلب الجهاز، اسمح بالتثبيت من هذا المصدر.
          files: mobile/home-heroes-${{ github.run_number }}.apk
          make_latest: true
