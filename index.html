<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6D3FD6" />
    <meta name="description" content="أبطال البيت — تطبيق عائلي لإدارة المسؤوليات والمهارات والمكافآت." />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>أبطال البيت</title>
    <script>
      // apply theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem('hh-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
        var l = localStorage.getItem('hh-lang');
        if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
